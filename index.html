<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퀴즈 뽑기 배틀</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{ --paper:#FFF8E7; --ink:#23264F; --sun:#FFD23F; --coral:#FF6B6B; --mint:#2EC4A6; --line:#23264F; --muted:#6B6E92; --card:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
@media (prefers-color-scheme: dark){ :root{ --paper:#1B1D3A; --ink:#FFF3D6; --card:#272A52; --line:#FFF3D6; --muted:#B7B9D9; } }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:16px; line-height:1.5; }
.wrap{ max-width:520px; margin:0 auto; padding:20px 16px 40px; }
h1,h2,.display{ font-family:"Jua","Apple SD Gothic Neo",sans-serif; font-weight:400; margin:0; }
h1{ font-size:2.4rem; line-height:1.1; } h2{ font-size:1.3rem; margin-bottom:10px; }
p{ margin:0 0 12px; } .sub{ color:var(--muted); font-size:.95rem; }
.box{ background:var(--card); border:2.5px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:4px 4px 0 var(--line); }
input,textarea{ width:100%; font:inherit; color:var(--ink); background:var(--paper); border:2px solid var(--line); border-radius:12px; padding:10px 12px; }
textarea{ resize:vertical; min-height:56px; }
label{ display:block; font-size:.9rem; color:var(--muted); margin:10px 0 4px; }
button{ font-family:"Jua",sans-serif; font-size:1.1rem; color:#23264F; background:var(--sun); border:2.5px solid var(--line); border-radius:14px; padding:12px 16px; cursor:pointer; box-shadow:3px 3px 0 var(--line); }
button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line); }
button:disabled{ opacity:.4; cursor:not-allowed; }
button:focus-visible,input:focus-visible,textarea:focus-visible{ outline:3px solid var(--coral); outline-offset:2px; }
.full{ width:100%; } .ghost{ background:transparent; color:var(--ink); box-shadow:none; border-width:2px; font-size:.95rem; padding:8px 12px; }
.coral{ background:var(--coral); color:#fff; } .mint{ background:var(--mint); color:#fff; }
.row{ display:flex; gap:8px; } .row>*{ flex:1; }
.hide{ display:none !important; }
.code{ font-family:"Jua",sans-serif; font-size:3rem; letter-spacing:.2em; line-height:1; }
.plist{ list-style:none; margin:0; padding:0; }
.plist li{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:2px dashed var(--muted); }
.plist li:last-child{ border:0; }
.tag{ font-family:"Jua",sans-serif; font-size:.85rem; padding:1px 10px; border-radius:999px; border:2px solid var(--line); }
.tag.ok{ background:var(--mint); color:#fff; border-color:var(--mint); }
.ticket{ position:relative; background:var(--sun); color:#23264F; border:3px solid var(--line); border-radius:20px; padding:22px 18px 18px; box-shadow:5px 5px 0 var(--line); margin-bottom:14px; }
.ticket::before,.ticket::after{ content:""; position:absolute; top:50%; width:22px; height:22px; background:var(--paper); border:3px solid var(--line); border-radius:50%; transform:translateY(-50%); }
.ticket::before{ left:-13px; clip-path:inset(0 0 0 50%); } .ticket::after{ right:-13px; clip-path:inset(0 50% 0 0); }
.ticket .by{ font-family:"Jua",sans-serif; background:#23264F; color:var(--sun); display:inline-block; padding:2px 12px; border-radius:999px; margin-bottom:10px; }
.ticket .q{ font-family:"Jua",sans-serif; font-size:1.6rem; line-height:1.3; word-break:keep-all; }
.ticket .ans{ margin-top:12px; padding-top:10px; border-top:2px dashed #23264F; }
.pop{ animation:pop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop{ from{ transform:scale(.6) rotate(-6deg); opacity:0; } to{ transform:none; opacity:1; } }
@media (prefers-reduced-motion: reduce){ .pop{ animation:none; } }
.timer{ font-family:"Jua",sans-serif; font-size:3.2rem; text-align:center; line-height:1; margin:4px 0 8px; }
.timer.low{ color:var(--coral); }
.bar{ height:10px; border:2px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:14px; }
.bar i{ display:block; height:100%; background:var(--mint); width:100%; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
.score{ width:100%; border-collapse:collapse; }
.score td{ padding:8px 4px; border-bottom:2px dashed var(--muted); }
.score tr:last-child td{ border:0; }
.score td:last-child{ text-align:right; font-family:"Jua",sans-serif; font-size:1.2rem; }
.rank{ font-family:"Jua",sans-serif; width:44px; }
.pay{ font-family:"Jua",sans-serif; font-size:1.15rem; padding:10px 0; border-bottom:2px dashed var(--muted); }
.pay:last-child{ border:0; }
.top{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px; }
.wait{ text-align:center; padding:28px 0; }
.toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-family:"Jua",sans-serif; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
.toast.show{ opacity:1; }
.net{ position:fixed; top:calc(8px + env(safe-area-inset-top,0px)); right:8px; font-size:.8rem; background:var(--coral); color:#fff; padding:2px 10px; border-radius:999px; }
</style>
</head>
<body>
<div class="net hide" id="net">연결 확인 중</div>
<div class="wrap">

<section id="s-home">
  <h1>퀴즈 뽑기<br>배틀</h1>
  <p class="sub" style="margin-top:8px">각자 자기 관련 퀴즈 3개. 내 퀴즈가 뽑혀서 3분 안에 아무도 못 맞히면 내가 -1점.</p>
  <div class="box">
    <label for="myName" style="margin-top:0">내 이름</label>
    <input id="myName" maxlength="10" placeholder="이름">
  </div>
  <div class="box">
    <h2>방 들어가기</h2>
    <div class="row">
      <input id="joinCode" inputmode="numeric" maxlength="4" placeholder="방 코드 4자리" style="flex:2">
      <button id="joinBtn">입장</button>
    </div>
  </div>
  <button class="full coral" id="createBtn">새 방 만들기</button>
</section>

<section id="s-lobby" class="hide">
  <div class="box" style="text-align:center">
    <p class="sub" style="margin:0">방 코드</p>
    <div class="code" id="lobbyCode"></div>
    <button class="ghost" id="shareBtn" style="margin-top:10px">링크 공유</button>
  </div>
  <div class="box">
    <h2>참가자</h2>
    <ul class="plist" id="lobbyPlayers"></ul>
  </div>
  <div class="box" id="quizForm">
    <h2>내 퀴즈 3개</h2>
    <p class="sub">정답은 내 퀴즈가 뽑혔을 때 내 폰에만 보여.</p>
    <div id="fields"></div>
    <button class="full" id="submitBtn" style="margin-top:14px">퀴즈 제출</button>
  </div>
  <div class="box hide" id="quizDone" style="text-align:center">
    <h2>퀴즈 제출 완료</h2>
    <button class="ghost" id="editBtn">다시 쓰기</button>
  </div>
  <button class="full coral hide" id="startBtn">게임 시작</button>
  <p class="sub wait hide" id="lobbyWait">방장이 시작하길 기다리는 중</p>
</section>

<section id="s-play" class="hide">
  <div class="top">
    <span class="display" id="remain"></span>
    <span class="row" style="flex:0 0 auto" id="hostTools">
      <button class="ghost" id="undoBtn">되돌리기</button>
      <button class="ghost" id="endBtn">끝내기</button>
    </span>
  </div>
  <div id="idle">
    <button class="full coral" id="drawBtn" style="font-size:1.5rem;padding:20px">퀴즈 뽑기</button>
    <p class="sub wait" id="idleWait">방장이 퀴즈 뽑는 중</p>
  </div>
  <div id="live" class="hide">
    <div class="ticket" id="ticket">
      <div class="by" id="qBy"></div>
      <div class="q" id="qText"></div>
      <div class="ans hide" id="qAns"></div>
    </div>
    <div class="timer" id="timer">3:00</div>
    <div class="bar"><i id="timerBar"></i></div>
    <div id="judge">
      <div class="box">
        <h2>먼저 "정답!" 외친 사람이 맞혔어</h2>
        <div class="grid" id="answerers"></div>
      </div>
      <button class="full" id="failBtn" style="background:var(--card);color:var(--ink)">아무도 못 맞힘 · 출제자 -1</button>
    </div>
    <p class="sub wait" id="judgeWait">정답이다 싶으면 "정답!" 외쳐. 출제자가 골라줄 거야.</p>
  </div>
  <div class="box" style="margin-top:14px">
    <h2>점수</h2>
    <table class="score" id="scoreTable"></table>
  </div>
</section>

<section id="s-result" class="hide">
  <h1 style="margin-bottom:16px">결과</h1>
  <div class="box"><table class="score" id="finalTable"></table></div>
  <div class="box"><h2>누가 누구한테 사?</h2><div id="payList"></div></div>
  <div class="row">
    <button class="ghost hide" id="undoBtn2">되돌리기</button>
    <button class="coral" id="leaveBtn">나가기</button>
  </div>
</section>

</div>
<div class="toast" id="toast"></div>

<script>
const LIMIT = 180, PER = 3, POLL = 1500, SKEY = "quizBattle.me";
const $ = (id) => document.getElementById(id);
let me = { code: "", name: "" };
let R = null, offset = 0, pollH = null, lastCurId = null, lastEvent = 0, buzzed = null, errCount = 0;

try { me = JSON.parse(localStorage.getItem(SKEY)) || me; } catch (e) {}
function remember() { try { localStorage.setItem(SKEY, JSON.stringify(me)); } catch (e) {} }
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
function show(id) { ["s-home","s-lobby","s-play","s-result"].forEach((s) => $(s).classList.toggle("hide", s !== id)); }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(body) {
  const r = await fetch("/api/room", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: "응답을 못 읽었어" }));
  if (!r.ok) throw new Error(j.error || "요청 실패");
  return j;
}
async function act(action, extra = {}) {
  try { apply(await api({ action, code: me.code, name: me.name, ...extra })); }
  catch (e) { toast(e.message); }
}
async function poll() {
  if (!me.code) return;
  try {
    const r = await fetch(`/api/room?code=${encodeURIComponent(me.code)}&me=${encodeURIComponent(me.name)}`, { cache: "no-store" });
    if (r.status === 404) { toast("방이 없어졌어"); leave(); return; }
    apply(await r.json());
    errCount = 0; $("net").classList.add("hide");
  } catch (e) {
    if (++errCount > 2) $("net").classList.remove("hide");
  }
}
function startPoll() { stopPoll(); if (document.hidden) return; poll(); pollH = setInterval(poll, POLL); }
function stopPoll() { if (pollH) clearInterval(pollH); pollH = null; }
document.addEventListener("visibilitychange", () => { if (document.hidden) stopPoll(); else if (me.code) startPoll(); });

/* 홈 */
$("myName").value = me.name || "";
const urlRoom = new URLSearchParams(location.search).get("room");
if (urlRoom) $("joinCode").value = urlRoom;
function getName() { const n = $("myName").value.trim(); if (!n) { toast("이름부터 입력해줘"); $("myName").focus(); } return n; }
$("createBtn").onclick = async () => {
  const n = getName(); if (!n) return;
  try { const r = await api({ action: "create", name: n }); me = { code: r.code, name: n }; remember(); apply(r); startPoll(); }
  catch (e) { toast(e.message); }
};
$("joinBtn").onclick = async () => {
  const n = getName(); if (!n) return;
  const c = $("joinCode").value.trim();
  if (!/^\d{4}$/.test(c)) { toast("방 코드 4자리를 입력해줘"); return; }
  try { const r = await api({ action: "join", code: c, name: n }); me = { code: c, name: n }; remember(); apply(r); startPoll(); }
  catch (e) { toast(e.message); }
};
function leave() { stopPoll(); me.code = ""; R = null; remember(); history.replaceState(null, "", location.pathname); show("s-home"); }
$("leaveBtn").onclick = leave;

/* 로비 */
let f = ""; for (let i = 0; i < PER; i++) f += `<label for="q${i}">퀴즈 ${i+1}</label><textarea id="q${i}" maxlength="200" placeholder="예: 내 카톡에 은영이는 뭐라고 저장돼 있게?"></textarea><label for="a${i}">정답</label><input id="a${i}" maxlength="100">`;
$("fields").innerHTML = f;
let editing = false;
$("submitBtn").onclick = async () => {
  const quizzes = [];
  for (let i = 0; i < PER; i++) {
    const q = $("q"+i).value.trim();
    if (!q) { toast(`퀴즈 ${i+1}이 비어 있어`); $("q"+i).focus(); return; }
    quizzes.push({ q, a: $("a"+i).value.trim() });
  }
  editing = false; await act("submit", { quizzes });
};
$("editBtn").onclick = () => { editing = true; render(); };
$("startBtn").onclick = () => act("start");
$("shareBtn").onclick = async () => {
  const url = `${location.origin}${location.pathname}?room=${me.code}`;
  try { if (navigator.share) await navigator.share({ title: "퀴즈 뽑기 배틀", text: `방 코드 ${me.code}`, url }); else { await navigator.clipboard.writeText(url); toast("링크 복사했어"); } } catch (e) {}
};

/* 게임 */
$("drawBtn").onclick = () => act("draw");
$("failBtn").onclick = () => R.cur && act("resolve", { id: R.cur.id, winner: null });
$("undoBtn").onclick = $("undoBtn2").onclick = () => { if (confirm("직전 판정을 되돌릴까?")) act("undo"); };
$("endBtn").onclick = () => { if (confirm("지금 끝내고 결과 볼래?")) act("end"); };

function apply(r) {
  if (!r || r.error) return;
  offset = r.now - Date.now();
  if (r.last && r.last.t !== lastEvent) { if (lastEvent) toast(r.last.text); lastEvent = r.last.t; }
  R = r; render();
}

function scoreRows(el) {
  const s = [...R.players].sort((a, b) => b.score - a.score);
  el.innerHTML = s.map((p) => `<tr><td class="rank">${s.findIndex((x) => x.score === p.score) + 1}등</td><td>${esc(p.name)}${p.name === me.name ? " (나)" : ""}</td><td>${p.score}점</td></tr>`).join("");
  return s;
}

function render() {
  if (!R) { show("s-home"); return; }
  const isHost = R.host === me.name;
  const mine = R.players.find((p) => p.name === me.name);

  if (R.phase === "lobby") {
    show("s-lobby");
    $("lobbyCode").textContent = R.code;
    $("lobbyPlayers").innerHTML = R.players.map((p) => `<li><span>${esc(p.name)}${p.name === R.host ? " · 방장" : ""}${p.name === me.name ? " (나)" : ""}</span><span class="tag ${p.submitted ? "ok" : ""}">${p.submitted ? "제출" : "작성 중"}</span></li>`).join("");
    const done = mine && mine.submitted && !editing;
    $("quizForm").classList.toggle("hide", done);
    $("quizDone").classList.toggle("hide", !done);
    $("startBtn").classList.toggle("hide", !isHost);
    $("startBtn").disabled = R.players.filter((p) => p.submitted).length < 2;
    $("lobbyWait").classList.toggle("hide", isHost);
    return;
  }

  if (R.phase === "play") {
    show("s-play");
    $("remain").textContent = `남은 퀴즈 ${R.remaining}/${R.total}`;
    $("hostTools").classList.toggle("hide", !isHost);
    $("undoBtn").disabled = !R.canUndo;
    const c = R.cur;
    $("idle").classList.toggle("hide", !!c);
    $("live").classList.toggle("hide", !c);
    if (!c) {
      $("drawBtn").classList.toggle("hide", !isHost);
      $("idleWait").classList.toggle("hide", isHost);
      lastCurId = null;
    } else {
      if (c.id !== lastCurId) {
        lastCurId = c.id; buzzed = null;
        $("qBy").textContent = `출제자 ${c.by}`;
        $("qText").textContent = c.q;
        const t = $("ticket"); t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
        const judge = c.by === me.name;
        $("judge").classList.toggle("hide", !judge);
        $("judgeWait").classList.toggle("hide", judge);
        $("answerers").innerHTML = R.players.filter((p) => p.name !== c.by)
          .map((p) => `<button class="mint" data-n="${esc(p.name)}">${esc(p.name)} +1</button>`).join("");
        $("answerers").querySelectorAll("button").forEach((b) => b.onclick = () => act("resolve", { id: c.id, winner: b.dataset.n }));
      }
      const a = $("qAns");
      a.classList.toggle("hide", c.by !== me.name);
      a.textContent = c.a ? `정답: ${c.a}` : "정답 미입력";
      drawTimer();
    }
    scoreRows($("scoreTable"));
    return;
  }

  show("s-result");
  const s = scoreRows($("finalTable")), n = s.length, lines = [];
  if (n >= 2) lines.push(`${s[n-1].name} → ${s[0].name}한테 사주기`);
  if (n >= 4) lines.push(`${s[n-2].name} → ${s[1].name}한테 사주기`);
  const tie = new Set(s.map((p) => p.score)).size < n;
  $("payList").innerHTML = lines.map((l) => `<div class="pay">${esc(l)}</div>`).join("") + (tie ? `<p class="sub" style="margin-top:10px">동점자가 있어. 순위는 가위바위보로 정해줘.</p>` : "");
  $("undoBtn2").classList.toggle("hide", !(isHost && R.canUndo));
}

function drawTimer() {
  if (!R || !R.cur) return;
  const left = Math.max(0, LIMIT - Math.floor((Date.now() + offset - R.cur.startedAt) / 1000));
  $("timer").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  $("timer").classList.toggle("low", left <= 30);
  $("timerBar").style.width = (left / LIMIT * 100) + "%";
  if (left === 0 && buzzed !== R.cur.id) {
    buzzed = R.cur.id;
    $("timer").textContent = "시간 끝!";
    try { navigator.vibrate && navigator.vibrate([300, 100, 300]); } catch (e) {}
  }
}
setInterval(drawTimer, 250);

if (me.code && me.name) startPoll(); else show("s-home");
</script>
</body>
</html>
